plugins {
    id 'com.android.application'
}
// Load keystore
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'com.martinatanasov.colornotebook'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.martinatanasov.colornotebook"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 1
        versionName "1.0.0-ALPHA"

        Properties properties = new Properties()
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String", "LOADING_IMAGE", "\"${properties.getProperty("LOADING_IMAGE")}\""
        buildConfigField "String", "CHECK_DEV", "\"${properties.getProperty("CHECK_DEV")}\""
        buildConfigField "String", "APP_WEBSITE", "\"${properties.getProperty("APP_WEBSITE")}\""

        //Set supported per-app language
        resourceConfigurations += ['en']

        //Support library for vector animations
        vectorDrawables.useSupportLibrary = true

        //Espresso setup
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        animationsDisabled = true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding false
        // buildConfig default value false
        buildConfig true
    }

    //Generate archived APK
    bundle {
        storeArchive {
            enable = true
        }
    }

    lint {
        checkReleaseBuilds = true
    }

    // Check for deprecations
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

dependencies {

    //Android base
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //For developers using AndroidX in their applications
    implementation 'pub.devrel:easypermissions:3.0.0'

    //RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"

    //Glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'androidx.activity:activity:1.13.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    //Volley: http library
    implementation 'com.android.volley:volley:1.2.1'

    //NotificationCompat used for foreground services
    implementation "androidx.core:core:1.19.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.11.0"

    //Http client
    implementation("com.squareup.okhttp3:okhttp:5.4.0")

    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    //Optional, for extra features
    implementation 'org.osmdroid:osmdroid-wms:6.1.20'
//    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    //LeakCanary
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'

    //Junit
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation "androidx.work:work-testing:2.11.2"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'

    //Espresso Setup
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation "androidx.work:work-testing:2.11.2"

    //Chart library
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //Shimmer effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //WorkManager Java
    implementation "androidx.work:work-runtime:2.11.2"
    //Optional - Multiprocess support for WorkManager
    implementation "androidx.work:work-multiprocess:2.11.2"

}